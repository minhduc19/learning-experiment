x-backend-environment: &backend-environment
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
  CORPUS_DATA_DIR: /app/data/corpus
  CORPUS_MAX_UPLOAD_BYTES: ${CORPUS_MAX_UPLOAD_BYTES:-1073741824}
  READING_DATA_DIR: /app/data/readings
  PGHOST: db
  PGPORT: "5432"
  PGUSER: ${PGUSER:-learning}
  PGPASSWORD: ${PGPASSWORD:-learning_dev}
  PGDATABASE: ${PGDATABASE:-learning}

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${PGUSER:-learning}
      POSTGRES_PASSWORD: ${PGPASSWORD:-learning_dev}
      POSTGRES_DB: ${PGDATABASE:-learning}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    volumes:
      - reading_data:/app/data/readings
      - corpus_data:/app/data/corpus
    environment:
      <<: *backend-environment
      DEEPSEEK: ${DEEPSEEK:-}
      ELEVEN: ${ELEVEN:-}
    depends_on:
      db:
        condition: service_healthy
      corpus-migrate:
        condition: service_completed_successfully
    build: &backend-build
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  corpus-migrate:
    build: *backend-build
    environment: *backend-environment
    command: ["python", "-m", "app.corpus.migrate"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
  corpus-worker:
    build: *backend-build
    environment: *backend-environment
    volumes:
      - corpus_data:/app/data/corpus
    command: ["python", "-m", "app.corpus.worker"]
    depends_on:
      corpus-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.corpus.health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  corpus_data:
  reading_data:
  postgres_data:
