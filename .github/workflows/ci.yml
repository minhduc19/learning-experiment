name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: npm run setup
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t learning-experiment .
      - run: docker run -d --name app -p 8080:8000 learning-experiment
      - run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8080/api/health
          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/docs
      - if: always()
        run: docker logs app; docker rm -f app
