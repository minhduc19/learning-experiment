name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: learning
          POSTGRES_PASSWORD: learning_dev
          POSTGRES_DB: learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning -d learning"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://learning:learning_dev@127.0.0.1:5432/learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: npm run setup
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Smoke test the installed Mandarin Piper voice
        run: |
          docker compose exec -T backend python - <<'PYTHON'
          import tempfile
          import wave
          from pathlib import Path
          from app.ai.piper_service import synthesize
          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / 'mandarin.wav'
              synthesize('你好，世界。', path)
              with wave.open(str(path), 'rb') as audio:
                  assert audio.getnframes() > 0
                  assert audio.getnchannels() == 1
                  print('Mandarin Piper smoke test passed:', audio.getframerate(), 'Hz')
          PYTHON
      - run: curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8080/api/health/db
      - name: Import and reconstruct a corpus story through Nginx
        run: |
          python3 - <<'PYTHON'
          import json
          import time
          from urllib.request import Request, urlopen

          base = 'http://localhost:8080/api/corpus'
          token = None
          def request(path, method='GET', data=None, headers=None):
              if isinstance(data, dict):
                  data = json.dumps(data).encode()
                  headers = {'Content-Type': 'application/json', **(headers or {})}
              headers = {**(headers or {}), **({'Authorization': 'Bearer ' + token} if token else {})}
              url = 'http://localhost:8080/api' + path if path.startswith('/auth/') else base + path
              with urlopen(Request(url, data=data, headers=headers, method=method), timeout=10) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          request('/auth/register', 'POST', {'email':'ci@example.com','username':'ci_user','password':'ci-test-password-123'})
          token = request('/auth/login', 'POST', {'email':'ci@example.com','password':'ci-test-password-123'})['access_token']
          text = '謝謝你。\r\n我學習中文！'.encode('utf-8')
          upload = request('/uploads', 'POST', {'filename': 'ci-story.txt', 'size': len(text)})
          request('/uploads/' + upload['id'], 'PATCH', text,
                  {'Content-Type': 'application/octet-stream', 'Upload-Offset': '0'})
          job = request('/imports', 'POST', {'upload_id': upload['id'], 'title': 'CI story'})
          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              status = request('/imports/' + job['id'])
              assert status['status'] != 'failed', status
              if status['status'] == 'completed':
                  break
              time.sleep(1)
          else:
              raise AssertionError('Corpus worker did not finish the import')
          with urlopen(Request(base + '/stories/' + job['story_id'] + '/text', headers={'Authorization':'Bearer '+token}), timeout=10) as response:
              assert response.read() == text, 'Reconstructed story differs from upload'
          with urlopen(Request(base + '/stories/' + job['story_id'] + '/text?script=simplified', headers={'Authorization':'Bearer '+token}), timeout=10) as response:
              assert response.read() == '谢谢你。\r\n我学习中文！'.encode('utf-8')
          with urlopen(Request(base + '/stories/' + job['story_id'] + '/text?script=traditional', headers={'Authorization':'Bearer '+token}), timeout=10) as response:
              assert response.read() == text
          print('Corpus upload, exact reconstruction, and both script exports passed')
          PYTHON
      - if: always()
        run: docker compose logs && docker compose down
