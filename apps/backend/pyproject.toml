[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "psycopg[binary]>=3.2,<4",
    "jieba>=0.42.1,<1",
    "pypinyin>=0.55,<1",
    "opencc-python-reimplemented>=0.1.7,<0.2",
    "argon2-cffi>=23,<26",
    "pyjwt>=2.10,<3",
    "email-validator>=2,<3",
    "openai>=2,<3",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]
