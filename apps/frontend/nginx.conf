server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker service addresses can change when containers are recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # Corpus uploads use bounded 8 MiB chunks; stream them to the API.
    location /api/corpus/uploads/ {
        client_max_body_size 9m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        set $backend_address backend:8000;
        proxy_pass http://$backend_address;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $backend_address backend:8000;
        proxy_pass http://$backend_address;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
